name: US hardware internship alerts

on:
  schedule:
    # Offset from the top of the hour to reduce scheduling delays.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "Choose a normal scan or a test Discord notification"
        type: choice
        required: true
        options:
          - scan
          - send_test
        default: scan

permissions:
  contents: write

concurrency:
  group: us-internship-alerts
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out project and saved state
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Send test or check sources
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATABASE_PATH: state/seen_jobs.sqlite3
          BOOTSTRAP_MODE: skip_existing
          TASK: ${{ inputs.task }}
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "::error::Add a repository Actions secret named DISCORD_WEBHOOK_URL"
            exit 1
          fi
          if [[ "$TASK" == "send_test" ]]; then
            python bot.py --send-test
          else
            python bot.py --once
          fi

      - name: Save seen-job database for future runs
        if: ${{ github.event_name == 'schedule' || inputs.task != 'send_test' }}
        run: |
          if [[ -f state/seen_jobs.sqlite3 ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f state/seen_jobs.sqlite3
            if ! git diff --cached --quiet; then
              git commit -m 'Update seen internship database [skip ci]'
              git push
            fi
          fi
